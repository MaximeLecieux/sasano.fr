name: Build and Publish React App (DEV)

on:
  #
  # Triggers the workflow on push or pull request events but only for the selected branch
  push:
    branches: [ dev, dev-cicd ]
  pull_request:
    branches: [ dev, dev-cicd ]
  #
  # Allows you to run this workflow manually from the Github Actions tab of the repository
  workflow_dispatch:

jobs:
  build-and-store:
    runs-on: ubuntu-latest

    # Sets the permissions granted to the GITHUB_TOKEN for the actions in this job.
    permissions:
      contents: read
      packages: write

    steps:
      #
      - name: Checkout repository
        uses: actions/checkout@v3
      #
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # registry-url: 'https://npm.pkg.github.com'
          # scope: '@${{ github.repository_owner }}'
      #
      - name: Cache Node dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      #
      - name: Install dependencies
        run: npm ci
      #
      - name: Get version from package.json
        id: package-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $PACKAGE_VERSION"
      #
      - name: Build project (static files)
        run: npm run build
      #
      - name: Store files as artifact
        id: artifact-upload-step
        uses: actions/upload-artifact@v4
        with:
          name: latest-dev
          path: out/
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      #
      # - name: Publish to GitHub Packages
      #   run: |
      #     cd out
      #     echo '{
      #       "name": "@${{ github.repository_owner }}/${{ github.event.repository.name }}-static",
      #       "version": "${{ steps.package-version.outputs.version }}",
      #       "description": "Built static files for ${{ github.repository }}",
      #       "publishConfig": {
      #         "registry": "https://npm.pkg.github.com/",
      #         "tag": "latest-dev"
      #       }
      #     }' > package.json
      #     npm publish --tag latest-dev
      #   env:
      #     NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-on-test-server:
    runs-on: ubuntu-latest
    needs: build-and-store

    steps:
      #
      - name: Get artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact-upload-step.outputs.artifact-id }}
          path: distfiles
      #    
      - name: Upload files to server using SSH key
        uses: appleboy/scp-action@v0.1.7
        with:
          # TODO move these 'vers' to 'secrets'
          host: ${{ vars.DEV_HOST }}
          username: ${{ vars.DEV_USERNAME }}
          port: ${{ vars.DEV_PORT }}
          key: ${{ secrets.DEV_SSH_KEY }}
          source: distfiles/*
          target: /home/jetnxzsd/public_html
          rm: true
          # Remove two parent folders
          # 1 -> 'distfiles' (added by scp-action)
          # 2 -> 'latest-dev' (added by download-artifact)
          strip_components: 2